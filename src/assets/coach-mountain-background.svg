<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#4b070c"/>
      <stop offset=".48" stop-color="#710b10"/>
      <stop offset="1" stop-color="#39060b"/>
    </linearGradient>
    <linearGradient id="far-range" x2=".18" y2="1">
